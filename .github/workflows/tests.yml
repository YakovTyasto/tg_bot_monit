name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "state/state.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the supported floor, 3.12 is what the scheduled workflows run.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q monitor.py btc_monitor tests
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Parse workflow YAML
        run: python -c "import glob,yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in glob.glob('.github/workflows/*.yml')]"
