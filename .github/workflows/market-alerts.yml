name: Hourly BTC alerts

on:
  schedule:
    # Offset from the top of the hour to reduce public API and Actions congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-monitor-persistent-state
  cancel-in-progress: false

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check significant market events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py alerts

      - name: Persist alert state when changed
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No alert was sent; state did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore(state): record BTC alert [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "State push attempt $attempt failed"
            sleep 2
          done
          exit 1
